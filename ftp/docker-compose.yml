services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ftpserver
      POSTGRES_USER: ftp
      POSTGRES_PASSWORD: ${FTP_DB_PASSWORD:-ftp}
    volumes:
      - pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ftp -d ftpserver"]
      interval: 5s
      timeout: 3s
      retries: 20

  # SeaweedFS: noi luu tru tep (S3 API tai seaweedfs:8333, chi trong mang compose). Doi khoa truoc khi trien khai that.
  seaweedfs:
    image: chrislusf/seaweedfs:4.50
    restart: unless-stopped
    command: server -dir=/data -s3 -s3.port=8333 -ip=seaweedfs
    environment:
      AWS_ACCESS_KEY_ID: ${FTP_S3_ACCESS_KEY:-ftp-demo-key}
      AWS_SECRET_ACCESS_KEY: ${FTP_S3_SECRET_KEY:-ftp-demo-secret-change-me}
    volumes:
      - seaweed-data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:9333/cluster/status >/dev/null || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 30

  ftp:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      seaweedfs:
        condition: service_healthy
    environment:
      FTP_STORAGE: s3          # "local": luu tren dia tai root.dir (can volume ftp-root)
      FTP_S3_ENDPOINT: http://seaweedfs:8333
      FTP_S3_BUCKET: ftp-files
      FTP_S3_ACCESS_KEY: ${FTP_S3_ACCESS_KEY:-ftp-demo-key}
      FTP_S3_SECRET_KEY: ${FTP_S3_SECRET_KEY:-ftp-demo-secret-change-me}
      FTP_DB_URL: jdbc:postgresql://db:5432/ftpserver
      FTP_DB_USER: ftp
      FTP_DB_PASSWORD: ${FTP_DB_PASSWORD:-ftp}
      # FTP_SCAN_COMMAND: "clamscan --no-summary"   # can build voi --build-arg WITH_CLAMAV=1
      # FTP_SCAN_ENFORCE: "true"
      # FTP_TLS_KEYSTORE: /app/certs/ftps.p12
      # FTP_TLS_KEYSTORE_PASSWORD: ${FTP_TLS_KEYSTORE_PASSWORD}
    ports:
      - "2121:2121"
      - "50000-50100:50000-50100"
    volumes:
      - ftp-logs:/app/logs
      # - ./certs:/app/certs:ro

volumes:
  pg-data:
  seaweed-data:
  ftp-logs:
