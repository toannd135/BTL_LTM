control.port=2121
root.dir=./ftproot
data.port.min=50000
data.port.max=50100
idle.timeout.seconds=300

# Dia chi IP cong khai ghi trong phan hoi PASV. Bat buoc khi chay sau NAT (VD VM Azure: dat la Public IP).
#pasv.address=20.x.x.x

# FTPS (explicit, AUTH TLS). Keystore PKCS12 tao bang scripts/gen-keystore.sh; KHONG commit keystore.
# Mat khau keystore nen truyen qua bien moi truong FTP_TLS_KEYSTORE_PASSWORD thay vi ghi vao tep nay.
#tls.keystore=./certs/ftps.p12
# true = bat buoc AUTH TLS truoc khi dang nhap va PROT P cho moi kenh du lieu
#tls.required=true

# Nhat ky kiem toan (dang nhap, upload, download, xoa, doi ten...)
audit.log=./logs/audit.log

# Tai khoan nam trong CSDL SQLite, tao/seed bang migration (src/main/resources/db/migration) khi server khoi dong.
# Mac dinh: admin/admin (quan tri) va sv/sv (sinh vien, nhot trong /sv). Doi mat khau truoc khi trien khai that.
db.path=./data/ftpserver.db
