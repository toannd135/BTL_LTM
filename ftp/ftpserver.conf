control.port=2121
root.dir=./ftproot
data.port.min=50000
data.port.max=50100
idle.timeout.seconds=300

# Dia chi IP cong khai ghi trong phan hoi PASV. Bat buoc khi chay sau NAT (VD VM Azure: dat la Public IP).
#pasv.address=20.x.x.x

# FTPS (explicit, AUTH TLS). Keystore PKCS12 tao bang scripts/gen-keystore.sh; KHONG commit keystore.
# Mat khau keystore nen truyen qua bien moi truong FTP_TLS_KEYSTORE_PASSWORD thay vi ghi vao tep nay.
#tls.keystore=./certs/ftps.p12
# true = bat buoc AUTH TLS truoc khi dang nhap va PROT P cho moi kenh du lieu
#tls.required=true

# Nhat ky kiem toan (dang nhap, upload, download, xoa, doi ten...)
audit.log=./logs/audit.log

# Tai khoan nam trong CSDL, tao/seed bang migration (src/main/resources/db/migration/{sqlite,postgres}) khi server khoi dong.
# Mac dinh: admin/admin (quan tri) va sv/sv (sinh vien, nhot trong /sv). Doi mat khau truoc khi trien khai that.
# Mac dinh dung SQLite tai db.path. Dat db.url (hoac env FTP_DB_URL) de dung PostgreSQL thay the; khi do db.path bi bo qua.
db.path=./data/ftpserver.db
# PostgreSQL (env FTP_DB_URL / FTP_DB_USER / FTP_DB_PASSWORD ghi de; nen dat mat khau qua env, khong ghi vao tep):
#   db.url=jdbc:postgresql://localhost:5432/ftpserver
#   db.user=ftp
#   db.password=...
# Chay nhanh mot Postgres de thu:
#   docker run -d --name ftp-pg -e POSTGRES_DB=ftpserver -e POSTGRES_USER=ftp -e POSTGRES_PASSWORD=ftp -p 5432:5432 postgres:16-alpine
#   FTP_DB_URL=jdbc:postgresql://localhost:5432/ftpserver FTP_DB_USER=ftp FTP_DB_PASSWORD=ftp java -jar target/ftpserver.jar ftpserver.conf

# Quet ma doc tep tai len (exit 0 = sach, 1 = nhiem; env FTP_SCAN_COMMAND ghi de). Vi du:
#   scan.command=clamdscan --no-summary --fdpass   (co daemon clamd, nhanh)
#   scan.command=clamscan --no-summary             (khong co daemon, ~7 s/tep)
#scan.command=
# true: tep chua quet xong cung bi chan tai ve (can scan.command; env FTP_SCAN_ENFORCE)
#scan.enforce=false
