<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>FTP Admin</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
</head>
<body class="bg-light">
{% if admin %}
<nav class="navbar navbar-expand navbar-dark bg-dark mb-4">
  <div class="container">
    <a class="navbar-brand" href="/">FTP Admin</a>
    <ul class="navbar-nav me-auto">
      <li class="nav-item"><a class="nav-link" href="/">Dashboard</a></li>
      <li class="nav-item"><a class="nav-link" href="/users">Người dùng</a></li>
      <li class="nav-item"><a class="nav-link" href="/files">Tệp tin</a></li>
      <li class="nav-item"><a class="nav-link" href="/audit">Nhật ký</a></li>
    </ul>
    <form method="post" action="/logout" class="d-flex align-items-center gap-2">
      <span class="text-light small">{{ admin }}</span>
      <input type="hidden" name="csrf" value="{{ csrf }}">
      <button class="btn btn-sm btn-outline-light">Đăng xuất</button>
    </form>
  </div>
</nav>
{% endif %}
<main class="container pb-5">
  {% if flash %}<div class="alert alert-{{ flash.kind }}">{{ flash.msg }}</div>{% endif %}
  {% block content %}{% endblock %}
</main>
</body>
</html>
