{% extends "base.html" %}
{% block content %}
<h3 class="mb-3">Quản lý người dùng</h3>
<div class="card shadow-sm mb-4"><div class="card-body">
  <form method="post" action="/users" class="row g-2">
    <input type="hidden" name="csrf" value="{{ csrf }}">
    <div class="col-md-3"><input name="username" class="form-control" placeholder="Tên đăng nhập" required></div>
    <div class="col-md-3"><input name="password" type="password" class="form-control" placeholder="Mật khẩu" required></div>
    <div class="col-md-2"><select name="role" class="form-select">{% for r in roles %}<option {{ 'selected' if r == 'user' }}>{{ r }}</option>{% endfor %}</select></div>
    <div class="col-md-2"><input name="home" class="form-control" placeholder="Thư mục (vd /sv2)" value="/"></div>
    <div class="col-md-2"><button class="btn btn-primary w-100">Tạo tài khoản</button></div>
  </form>
</div></div>
<div class="card shadow-sm"><div class="table-responsive"><table class="table align-middle mb-0">
  <thead><tr><th>Tài khoản</th><th>Quyền</th><th>Thư mục</th><th>Trạng thái</th><th>Đặt lại mật khẩu</th><th></th></tr></thead>
  <tbody>
  {% for u in users %}
    <tr>
      <td>{{ u.username }}</td>
      <td><form method="post" action="/users/{{ u.username }}/role" class="d-flex gap-1">
        <input type="hidden" name="csrf" value="{{ csrf }}">
        <select name="role" class="form-select form-select-sm" onchange="this.form.submit()">{% for r in roles %}<option {{ 'selected' if r == u.role }}>{{ r }}</option>{% endfor %}</select></form></td>
      <td>{{ u.home }}</td>
      <td>{% if u.enabled %}<span class="badge text-bg-success">Hoạt động</span>{% else %}<span class="badge text-bg-secondary">Bị khóa</span>{% endif %}</td>
      <td><form method="post" action="/users/{{ u.username }}/password" class="d-flex gap-1">
        <input type="hidden" name="csrf" value="{{ csrf }}">
        <input name="password" type="password" class="form-control form-control-sm" placeholder="Mật khẩu mới" required>
        <button class="btn btn-sm btn-outline-secondary">Đặt</button></form></td>
      <td><form method="post" action="/users/{{ u.username }}/toggle">
        <input type="hidden" name="csrf" value="{{ csrf }}">
        <button class="btn btn-sm btn-outline-{{ 'danger' if u.enabled else 'success' }}">{{ 'Khóa' if u.enabled else 'Mở khóa' }}</button></form></td>
    </tr>
  {% endfor %}
  </tbody>
</table></div></div>
{% endblock %}
