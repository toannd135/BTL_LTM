<div class="table-responsive"><table class="table table-sm table-hover mb-0 align-middle">
  <thead><tr><th>Thời gian</th><th>Người dùng</th><th>IP</th><th>Sự kiện</th><th>Kết quả</th><th>Chi tiết</th></tr></thead>
  <tbody>
  {% for r in rows %}
    <tr>
      <td class="text-nowrap small">{{ r.ts[:19].replace('T', ' ') }}</td><td>{{ r.user }}</td><td>{{ r.ip }}</td><td><code>{{ r.event }}</code></td>
      <td><span class="badge text-bg-{{ 'success' if r.result == 'OK' else 'danger' }}">{{ r.result }}</span></td><td class="small">{{ r.detail }}</td>
    </tr>
  {% else %}<tr><td colspan="6" class="text-center text-muted">Chưa có dữ liệu</td></tr>{% endfor %}
  </tbody>
</table></div>
