name: CI/CD

# Build once, deploy many: CI build image bất biến rồi đẩy GHCR; Ansible chỉ kéo đúng tag về chạy.
# - PR        : test server + admin-web, kiểm tra Terraform/Ansible, build installer Windows / macOS / Linux
# - push main : như trên + image ghcr.io/<repo>/{ftpserver,ftpadmin}:sha-<commit> và :latest
# - tag v*    : như push main + image :<version> + GitHub Release đính kèm installer (.msi, .dmg, .deb)
# Triển khai: ansible-playbook site.yml -e app_version=sha-<commit>   (rollback = chạy lại với tag cũ)

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

# Push mới lên cùng nhánh/PR thì huỷ run cũ (tag không bị huỷ để release luôn chạy hết)
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  server-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ftp
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Build & test
        run: mvn -B verify
      - uses: actions/upload-artifact@v4
        with:
          name: ftpserver-jar
          path: ftp/target/ftpserver.jar   # jar đã shade, đúng thứ đã test; job image dùng lại, không build lại
          retention-days: 1

  infra-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      - name: Terraform fmt + validate
        working-directory: terraform
        run: |
          terraform fmt -check -recursive
          terraform init -backend=false -input=false
          terraform validate
      - name: Ansible syntax-check
        working-directory: ansible
        env:
          ANSIBLE_CONFIG: ansible.cfg
        run: |
          pipx install ansible-core
          ansible-galaxy collection install -r requirements.yml
          cp group_vars/ftpserver/vault.yml.example group_vars/ftpserver/vault.yml
          # ansible.cfg tro vault_password_file toi ~/.ansible-vault-pass; vault.yml o day la ban mau
          # chua ma hoa nen chi can tep ton tai (mat khau gia)
          echo ci-dummy > ~/.ansible-vault-pass
          ansible-playbook site.yml --syntax-check -i inventory/hosts.ini.example

  admin-web-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: t
          POSTGRES_USER: t
          POSTGRES_PASSWORD: t
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U t -d t" --health-interval 5s --health-timeout 3s --health-retries 20
    defaults:
      run:
        working-directory: ftp/admin-web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: ftp/admin-web/requirements.txt
      - name: Cài dependency
        run: pip install -r requirements.txt httpx
      # test tự dựng CSDL tạm từ ftp/src/main/resources/db/migration
      - name: Kiểm thử trang admin (PostgreSQL)
        env:
          ADMIN_TEST_PG_URL: postgresql://t:t@localhost:5432/t
        run: python test_admin.py

  # Bản cài client cho cả 3 hệ điều hành, mọi lần chạy (PR cũng build để bắt lỗi đóng gói sớm)
  ui-package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            type: deb
            ext: deb
          - os: windows-latest
            type: msi
            ext: msi
          - os: macos-latest
            type: dmg
            ext: dmg
    runs-on: ${{ matrix.os }}
    env:
      # Ký installer là tuỳ chọn: chỉ chạy khi đã khai báo secrets tương ứng
      WIN_CERT_PFX_BASE64: ${{ secrets.WIN_CERT_PFX_BASE64 }}
      WIN_CERT_PASSWORD: ${{ secrets.WIN_CERT_PASSWORD }}
      MAC_CERT_P12_BASE64: ${{ secrets.MAC_CERT_P12_BASE64 }}
      MAC_CERT_PASSWORD: ${{ secrets.MAC_CERT_PASSWORD }}
      MAC_SIGN_IDENTITY: ${{ secrets.MAC_SIGN_IDENTITY }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
    defaults:
      run:
        shell: bash
        working-directory: ftp-client-gui
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build jar + gom dependency (JavaFX đúng theo OS)
        run: |
          mvn -B verify
          mvn -B dependency:copy-dependencies -DoutputDirectory=target/libs -DincludeScope=runtime
          JAR=$(basename target/ftpclient-gui-*.jar)
          cp "target/$JAR" target/libs/
          echo "JAR=$JAR" >> "$GITHUB_ENV"

      - name: Tính version cho installer
        id: ver
        run: |
          # tag v1.2.3 -> 1.2.3; push main / PR dung 1.0.0
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then V="${GITHUB_REF_NAME#v}"; else V="1.0.0"; fi
          # MSI/DMG yêu cầu dạng số X.Y.Z
          echo "v=$V" >> "$GITHUB_OUTPUT"

      - name: Import chứng chỉ macOS (tuỳ chọn)
        if: matrix.os == 'macos-latest' && env.MAC_CERT_P12_BASE64 != ''
        run: |
          echo "$MAC_CERT_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p ci "$RUNNER_TEMP/build.keychain"
          security set-keychain-settings -lut 21600 "$RUNNER_TEMP/build.keychain"
          security unlock-keychain -p ci "$RUNNER_TEMP/build.keychain"
          security import "$RUNNER_TEMP/cert.p12" -k "$RUNNER_TEMP/build.keychain" -P "$MAC_CERT_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k ci "$RUNNER_TEMP/build.keychain"
          security list-keychains -d user -s "$RUNNER_TEMP/build.keychain" login.keychain

      - name: jpackage
        run: |
          jpackage \
            --type ${{ matrix.type }} \
            --name FtpClient \
            --app-version "${{ steps.ver.outputs.v }}" \
            --input target/libs \
            --main-jar "$JAR" \
            --main-class ftpclient.Launcher \
            --dest target/installer \
            --icon packaging/FtpClient.${{ matrix.os == 'windows-latest' && 'ico' || (matrix.os == 'macos-latest' && 'icns' || 'png') }} \
            ${{ matrix.os == 'windows-latest' && '--win-shortcut --win-menu' || '' }} \
            ${{ matrix.os == 'ubuntu-latest' && '--linux-shortcut' || '' }} \
            $( [[ "$RUNNER_OS" == macOS && -n "$MAC_SIGN_IDENTITY" ]] && echo "--mac-sign --mac-signing-key-user-name \"$MAC_SIGN_IDENTITY\"" )

      - name: Notarize DMG (tuỳ chọn)
        if: matrix.os == 'macos-latest' && env.MAC_SIGN_IDENTITY != '' && env.APPLE_ID != ''
        run: |
          for f in target/installer/*.dmg; do
            xcrun notarytool submit "$f" --apple-id "$APPLE_ID" --password "$APPLE_APP_PASSWORD" --team-id "$APPLE_TEAM_ID" --wait
            xcrun stapler staple "$f"
          done

      - name: Ký MSI (tuỳ chọn)
        if: matrix.os == 'windows-latest' && env.WIN_CERT_PFX_BASE64 != ''
        shell: pwsh
        run: |
          [IO.File]::WriteAllBytes("$env:RUNNER_TEMP\cert.pfx", [Convert]::FromBase64String($env:WIN_CERT_PFX_BASE64))
          $st = (Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\signtool.exe" | Sort-Object FullName | Select-Object -Last 1).FullName
          Get-ChildItem target/installer/*.msi | ForEach-Object {
            & $st sign /f "$env:RUNNER_TEMP\cert.pfx" /p $env:WIN_CERT_PASSWORD /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 $_.FullName
          }

      - uses: actions/upload-artifact@v4
        with:
          name: FtpClient-${{ matrix.os }}
          path: ftp-client-gui/target/installer/*.${{ matrix.ext }}
          if-no-files-found: error
          retention-days: 14

  # Chỉ build image khi test đã đạt và là push lên main / tag (PR không đẩy image)
  image:
    needs: [server-test, admin-web-test]
    if: github.event_name == 'push'
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: ftpserver
            context: ftp
          - name: ftpadmin
            context: ftp/admin-web
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        if: matrix.name == 'ftpserver'
        with:
          name: ftpserver-jar
          path: ftp/target
      - uses: docker/setup-buildx-action@v3
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}/${{ matrix.name }}
          tags: |
            type=sha,prefix=sha-,format=short
            type=semver,pattern={{version}}
            type=raw,value=latest,enable={{is_default_branch}}
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build và đẩy image lên GHCR
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          pull: true   # luôn lấy image gốc mới nhất để có bản vá OS
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

  release:
    needs: [infra-check, ui-package, image]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: FtpClient-*
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
