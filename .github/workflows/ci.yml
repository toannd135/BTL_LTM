name: CI/CD

# Một pipeline chung cho server (ftp/), UI desktop (ftp-client-gui/) và trang quản trị (ftp/admin-web/)
# - push main / PR : test server + build installer UI; push main thì đẩy Docker image :latest (ftpserver, ftpadmin)
# - tag v*         : như trên + đẩy image theo version + tạo GitHub Release (jar server + installer UI)

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # quet ca lich su git
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Commit cu chua mat khau da lo duoc allowlist trong .gitleaks.toml (action khong ho tro baseline)
          GITLEAKS_CONFIG: .gitleaks.toml

  server-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ftp
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Build & test
        run: mvn -B verify
      - uses: actions/upload-artifact@v4
        with:
          name: ftpserver-jar
          path: ftp/target/ftpserver.jar   # bo original-ftpserver.jar (jar chua shade)

  infra-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      - name: Terraform fmt + validate
        working-directory: terraform
        run: |
          terraform fmt -check -recursive
          terraform init -backend=false -input=false
          terraform validate
      - name: Ansible syntax-check
        working-directory: ansible
        env:
          ANSIBLE_CONFIG: ansible.cfg
        run: |
          pipx install ansible-core
          ansible-galaxy collection install -r requirements.yml
          cp group_vars/ftpserver/vault.yml.example group_vars/ftpserver/vault.yml
          ansible-playbook site.yml --syntax-check -i inventory/hosts.ini.example

  admin-web-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: t
          POSTGRES_USER: t
          POSTGRES_PASSWORD: t
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U t -d t" --health-interval 5s --health-timeout 3s --health-retries 20
    defaults:
      run:
        working-directory: ftp/admin-web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: ftp/admin-web/requirements.txt
      - name: Cài dependency
        run: pip install -r requirements.txt httpx
      # test tự dựng CSDL tạm từ ftp/src/main/resources/db/migration/{sqlite,postgres}
      - name: Kiểm thử trang admin (SQLite)
        run: python test_admin.py
      - name: Kiểm thử trang admin (PostgreSQL)
        env:
          ADMIN_TEST_PG_URL: postgresql://t:t@localhost:5432/t
        run: python test_admin.py
      - name: Kiểm tra build Docker image
        run: docker build -t ftpadmin:ci .


  ui-package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            type: deb
            ext: deb
          - os: windows-latest
            type: msi
            ext: msi
          - os: macos-latest
            type: dmg
            ext: dmg
    runs-on: ${{ matrix.os }}
    env:
      # Ký installer là tuỳ chọn: chỉ chạy khi đã khai báo secrets tương ứng
      WIN_CERT_PFX_BASE64: ${{ secrets.WIN_CERT_PFX_BASE64 }}
      WIN_CERT_PASSWORD: ${{ secrets.WIN_CERT_PASSWORD }}
      MAC_CERT_P12_BASE64: ${{ secrets.MAC_CERT_P12_BASE64 }}
      MAC_CERT_PASSWORD: ${{ secrets.MAC_CERT_PASSWORD }}
      MAC_SIGN_IDENTITY: ${{ secrets.MAC_SIGN_IDENTITY }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
    defaults:
      run:
        shell: bash
        working-directory: ftp-client-gui
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build jar + gom dependency (JavaFX đúng theo OS)
        run: |
          mvn -B verify
          mvn -B dependency:copy-dependencies -DoutputDirectory=target/libs -DincludeScope=runtime
          JAR=$(basename target/ftpclient-gui-*.jar)
          cp "target/$JAR" target/libs/
          echo "JAR=$JAR" >> "$GITHUB_ENV"

      - name: Tính version cho installer
        id: ver
        run: |
          # workflow chi chay voi tag v*, nen lay version tu tag v1.2.3 -> 1.2.3
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then V="${GITHUB_REF_NAME#v}"; else V="1.0.0"; fi
          # MSI/DMG yêu cầu dạng số X.Y.Z
          echo "v=$V" >> "$GITHUB_OUTPUT"

      - name: Import chứng chỉ macOS (tuỳ chọn)
        if: matrix.os == 'macos-latest' && env.MAC_CERT_P12_BASE64 != ''
        run: |
          echo "$MAC_CERT_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p ci "$RUNNER_TEMP/build.keychain"
          security set-keychain-settings -lut 21600 "$RUNNER_TEMP/build.keychain"
          security unlock-keychain -p ci "$RUNNER_TEMP/build.keychain"
          security import "$RUNNER_TEMP/cert.p12" -k "$RUNNER_TEMP/build.keychain" -P "$MAC_CERT_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k ci "$RUNNER_TEMP/build.keychain"
          security list-keychains -d user -s "$RUNNER_TEMP/build.keychain" login.keychain

      - name: jpackage
        run: |
          jpackage \
            --type ${{ matrix.type }} \
            --name FtpClient \
            --app-version "${{ steps.ver.outputs.v }}" \
            --input target/libs \
            --main-jar "$JAR" \
            --main-class ftpclient.Launcher \
            --dest target/installer \
            --icon packaging/FtpClient.${{ matrix.os == 'windows-latest' && 'ico' || (matrix.os == 'macos-latest' && 'icns' || 'png') }} \
            ${{ matrix.os == 'windows-latest' && '--win-shortcut --win-menu' || '' }} \
            ${{ matrix.os == 'ubuntu-latest' && '--linux-shortcut' || '' }} \
            $( [[ "$RUNNER_OS" == macOS && -n "$MAC_SIGN_IDENTITY" ]] && echo "--mac-sign --mac-signing-key-user-name \"$MAC_SIGN_IDENTITY\"" )

      - name: Notarize DMG (tuỳ chọn)
        if: matrix.os == 'macos-latest' && env.MAC_SIGN_IDENTITY != '' && env.APPLE_ID != ''
        run: |
          for f in target/installer/*.dmg; do
            xcrun notarytool submit "$f" --apple-id "$APPLE_ID" --password "$APPLE_APP_PASSWORD" --team-id "$APPLE_TEAM_ID" --wait
            xcrun stapler staple "$f"
          done

      - name: Ký MSI (tuỳ chọn)
        if: matrix.os == 'windows-latest' && env.WIN_CERT_PFX_BASE64 != ''
        shell: pwsh
        run: |
          [IO.File]::WriteAllBytes("$env:RUNNER_TEMP\cert.pfx", [Convert]::FromBase64String($env:WIN_CERT_PFX_BASE64))
          $st = (Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\signtool.exe" | Sort-Object FullName | Select-Object -Last 1).FullName
          Get-ChildItem target/installer/*.msi | ForEach-Object {
            & $st sign /f "$env:RUNNER_TEMP\cert.pfx" /p $env:WIN_CERT_PASSWORD /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 $_.FullName
          }

      - uses: actions/upload-artifact@v4
        with:
          name: FtpClient-${{ matrix.os }}
          path: ftp-client-gui/target/installer/*.${{ matrix.ext }}


  server-docker:
    needs: server-test
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: ftpserver-jar
          path: ftp/target
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}/ftpserver
          tags: |
            type=match,pattern=v(.*),group=1
            type=raw,value=latest
      - uses: docker/build-push-action@v6
        with:
          context: ftp
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  admin-docker:
    needs: admin-web-test
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}/ftpadmin
          tags: |
            type=match,pattern=v(.*),group=1
            type=raw,value=latest
      - uses: docker/build-push-action@v6
        with:
          context: ftp/admin-web
          build-args: WITH_CLAMAV=1   # client clamdscan, clamd chay container rieng
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  release:
    needs: [server-test, admin-web-test, ui-package]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
