name: Server CI/CD

on:
  push:
    branches: [main]
    tags: ['server-v*']
    paths: ['ftp/**', '.github/workflows/server.yml']
  pull_request:
    paths: ['ftp/**', '.github/workflows/server.yml']

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ftp
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Build & test
        run: mvn -B verify
      - uses: actions/upload-artifact@v4
        with:
          name: ftpserver-jar
          path: ftp/target/*.jar

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/server-v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: ftpserver-jar
      - uses: softprops/action-gh-release@v2
        with:
          files: '*.jar'

  docker:
    needs: build
    if: startsWith(github.ref, 'refs/tags/server-v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: ftpserver-jar
          path: ftp/target
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}/ftpserver
          tags: |
            type=match,pattern=server-v(.*),group=1
            type=raw,value=latest
      - uses: docker/build-push-action@v6
        with:
          context: ftp
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
