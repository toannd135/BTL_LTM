[defaults]
inventory = inventory/hosts.ini
roles_path = roles
host_key_checking = False
interpreter_python = auto_silent
result_format = yaml
# vault.yml ma hoa bang ansible-vault; mat khau dat NGOAI repo (tao: umask 077; openssl rand -base64 32 > ~/.ansible-vault-pass)
vault_password_file = ~/.ansible-vault-pass

[ssh_connection]
pipelining = True
