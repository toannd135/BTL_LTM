# Image do CI build + quet + day len GHCR (job `image`). VM chi keo ve, khong build.
# app_version: sha-<7 ky tu commit> (moi push main), <X.Y.Z> (tag vX.Y.Z) hoac latest (ban main moi nhat).
# Nen ghim sha-/version khi trien khai that: ansible-playbook site.yml -e app_version=sha-1a2b3c4
# Rollback = chay lai voi tag cu. Xem tag tai GitHub > Packages.
app_image_registry: ghcr.io/toannd135/btl_ltm
app_version: latest
postgres_image: postgres:16-alpine

# O du lieu Terraform gan vao LUN 0, mount tai ftp_base_dir
ftp_data_disk: /dev/disk/azure/scsi1/lun0
ftp_base_dir: /srv/ftp
ftp_app_uid: 10001           # trung uid user admin trong image ftpadmin

# VM-A B2ats_v2 (1 GB RAM): swap + gioi han heap Java (VM-B dat swap rieng trong group_vars/storage)
swap_size: 2G
ftp_java_opts: "-Xmx192m -XX:+UseSerialGC"

ftp_control_port: 2121
ftp_pasv_min: 50000
ftp_pasv_max: 50100
ftpadmin_port: 8080
# ftpadmin_bind: mac dinh 127.0.0.1 (roles/ftpserver/defaults), Terraform ghi 0.0.0.0 vao inventory khi mo NSG

# FTPS: dat true va tro toi keystore tao bang ftp/scripts/gen-keystore.sh
ftp_tls_enabled: true
ftp_tls_required: true
ftp_tls_keystore_src: "{{ playbook_dir }}/../ftp/certs/ftps.p12"

# Bi mat: dat trong vault.yml (xem vault.yml.example)
# Terraform ghi tf_ftp_db_password (mat khau Azure PostgreSQL) vao inventory; khong co thi dung vault
ftp_db_password: "{{ tf_ftp_db_password | default(vault_ftp_db_password) }}"
ftpadmin_secret: "{{ vault_ftpadmin_secret }}"
# Mat khau thay cho admin/admin, sv/sv, fm/fm, auditor/auditor o lan chay dau (>= 8 ky tu); rong = giu mac dinh va server canh bao
ftp_seed_password: "{{ vault_ftp_seed_password | default('') }}"
ftp_tls_keystore_password: "{{ vault_ftp_tls_keystore_password | default('') }}"
# Noi luu tru tep: s3 = SeaweedFS tren VM-B (role storage, S3 API qua IP private storage_private_ip); local = o dia ./ftproot
ftp_storage: s3
seaweedfs_image: chrislusf/seaweedfs:4.50
ftp_s3_bucket: ftp-files
ftp_s3_access_key: "{{ vault_ftp_s3_access_key | default('') }}"
ftp_s3_secret_key: "{{ vault_ftp_s3_secret_key | default('') }}"
# Package GHCR private thi can PAT classic scope read:packages; package public thi de trong
ghcr_username: "{{ vault_ghcr_username | default('') }}"
ghcr_token: "{{ vault_ghcr_token | default('') }}"
