# Gioi han RAM tung container tren VM-B (>= 2 GB RAM). clamd nap CSDL chu ky nen can nhieu nhat
seaweedfs_mem_limit: 512m
seaweedfs_gomemlimit: 300MiB
clamd_mem_limit: 2g
# Tep lon hon gioi han nay clamd tu choi (INSTREAM size limit exceeded) -> tep o lai PENDING
clamd_max_file_size: 500M
clamav_image: clamav/clamav:stable
# Snapshot o du lieu hang ngay (cron, gio UTC cua VM). 15:45 UTC = 22:45 VN, truoc gio tu tat 23:00.
# backup_disk_id / backup_resource_group_id / backup_location / backup_keep do Terraform ghi vao inventory
backup_cron_hour: "15"
backup_cron_minute: "45"
# Chan tep nen/tai lieu co mat khau (khong quet duoc ben trong). false neu nguoi dung can gui tep zip co mat khau
clamd_alert_encrypted: true
