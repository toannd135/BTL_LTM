# Muc uu tien thap nhat de inventory do Terraform sinh (ftpadmin_bind=0.0.0.0) ghi de duoc
ftpadmin_bind: 127.0.0.1

# Quet ma doc: clamd chay tren VM-B (role storage); FTP server va admin-web gui noi dung qua INSTREAM (TCP 3310),
# khong can ClamAV trong image. true = bat quet; ftp_scan_enforce: tep chua quet xong cung khong tai ve duoc
clamav_enabled: true
ftp_scan_enforce: true   # clamd loi/qua han muc => tep o PENDING va bi chan tai, khong "fail-open"

# Postgres ngoai (Azure Database for PostgreSQL, Terraform ghi vao inventory). Rong = chay container db tren VM
ftp_db_host: ""
ftp_db_url_suffix: "{{ ftp_db_host ~ ':5432/ftpserver?sslmode=require' if ftp_db_host else 'db:5432/ftpserver' }}"
