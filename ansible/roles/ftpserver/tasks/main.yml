- name: Kiem tra bien bat buoc
  ansible.builtin.assert:
    that:
      - ftp_public_ip is defined and ftp_public_ip | length > 0
      - ftp_db_password | length >= 12
      - ftpadmin_secret | length >= 32
      - ftp_storage in ['s3', 'local']
      - (ftp_storage != 's3' and not clamav_enabled) or storage_private_ip is defined
      - ftp_storage != 's3' or (ftp_s3_access_key | length >= 8 and ftp_s3_secret_key | length >= 16)
    fail_msg: "Thieu ftp_public_ip / storage_private_ip (inventory), bi mat trong group_vars/ftpserver/vault.yml qua ngan, hoac thieu vault_ftp_s3_access_key/vault_ftp_s3_secret_key (ftp_storage: s3)"
    quiet: true

- name: Tao thu muc du lieu ung dung (uid {{ ftp_app_uid }} dung chung cho ftpserver va admin-web)
  ansible.builtin.file:
    path: "{{ ftp_base_dir }}/{{ item }}"
    state: directory
    owner: "{{ ftp_app_uid }}"
    group: "{{ ftp_app_uid }}"
    mode: "0750"
  loop: [ftproot, logs, data, quarantine]

- name: Tao thu muc cau hinh va Postgres
  ansible.builtin.file:
    path: "{{ ftp_base_dir }}/{{ item.path }}"
    state: directory
    mode: "{{ item.mode }}"
  loop:
    - { path: config, mode: "0755" }
    - { path: certs, mode: "0755" }    # uid ung dung can di qua thu muc; tep ftps.p12 van 0400 chu uid ung dung
    - { path: pgdata, mode: "0700" }   # entrypoint postgres tu chown

- name: Chep keystore FTPS
  ansible.builtin.copy:
    src: "{{ ftp_tls_keystore_src }}"
    dest: "{{ ftp_base_dir }}/certs/ftps.p12"
    owner: "{{ ftp_app_uid }}"
    mode: "0400"
  when: ftp_tls_enabled
  notify: Khoi dong lai ftpserver

- name: Ghi ftpserver.conf
  ansible.builtin.template:
    src: ftpserver.conf.j2
    dest: "{{ ftp_base_dir }}/config/ftpserver.conf"
    mode: "0644"
  notify: Khoi dong lai ftpserver

- name: Ghi .env (bi mat)
  ansible.builtin.template:
    src: env.j2
    dest: "{{ ftp_base_dir }}/.env"
    mode: "0600"
  no_log: true

- name: Ghi docker-compose.yml
  ansible.builtin.template:
    src: docker-compose.yml.j2
    dest: "{{ ftp_base_dir }}/docker-compose.yml"
    mode: "0644"

- name: Kiem tra da chon phien ban image
  ansible.builtin.assert:
    that: app_version | length > 0
    fail_msg: "Chua dat app_version (vd -e app_version=sha-1a2b3c4 hoac 1.2.0)"

# Khong build tren VM: CI da build + quet image, o day chi keo dung tag ve
- name: Dang nhap GHCR (package private)
  ansible.builtin.command:
    cmd: docker login ghcr.io -u {{ ghcr_username }} --password-stdin
    stdin: "{{ ghcr_token }}"
  when: ghcr_token | length > 0
  changed_when: false
  no_log: true

- name: Keo image va chay stack
  community.docker.docker_compose_v2:
    project_src: "{{ ftp_base_dir }}"
    build: never
    pull: always   # tag sha-/version khong doi noi dung; voi latest thi lay ban moi nhat
    remove_orphans: true   # xoa container cua service da bo (vd seaweedfs/clamd cu tren VM-A)
    state: present

- name: Xoa thu muc build cu (truoc day build image tren VM)
  ansible.builtin.file:
    path: "{{ ftp_base_dir }}/build"
    state: absent

- name: Cho cong FTP mo
  ansible.builtin.wait_for:
    port: "{{ ftp_control_port }}"
    timeout: 60

- name: Don image cu khong con dung (giu dia trong tren VM nho)
  ansible.builtin.command: docker image prune -af --filter "until=168h"
  register: ftp_prune
  changed_when: "'Total reclaimed space: 0B' not in ftp_prune.stdout"

- name: Phien ban dang chay
  ansible.builtin.debug:
    msg: "ftpserver/ftpadmin = {{ app_image_registry }}/*:{{ app_version }}"
