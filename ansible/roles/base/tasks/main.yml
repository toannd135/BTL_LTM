- name: Cai goi co ban
  ansible.builtin.apt:
    name: [ca-certificates, curl, gnupg]
    update_cache: true
    cache_valid_time: 3600

- name: Cho o du lieu xuat hien
  ansible.builtin.wait_for:
    path: "{{ ftp_data_disk }}"
    timeout: 120

- name: Tao filesystem tren o du lieu (chi lan dau, khong ghi de)
  community.general.filesystem:
    dev: "{{ ftp_data_disk }}"
    fstype: ext4

- name: Lay UUID o du lieu
  ansible.builtin.command: blkid -s UUID -o value {{ ftp_data_disk }}
  register: data_disk_uuid
  changed_when: false

- name: Mount o du lieu
  ansible.posix.mount:
    path: "{{ ftp_base_dir }}"
    src: "UUID={{ data_disk_uuid.stdout }}"
    fstype: ext4
    opts: defaults,nofail
    state: mounted

# VM chi co 1 GB RAM: them swap de Java + Postgres + admin-web khong bi OOM
- name: Kiem tra swapfile
  ansible.builtin.stat:
    path: /swapfile
  register: swapfile

# Tao moi hoac doi kich thuoc (vd 2G -> 4G khi bat ClamAV)
- name: Tao/doi kich thuoc swapfile
  ansible.builtin.shell: |
    swapoff /swapfile 2>/dev/null || true
    rm -f /swapfile
    fallocate -l {{ swap_size }} /swapfile
    chmod 600 /swapfile
    mkswap /swapfile
    swapon /swapfile
  when: not swapfile.stat.exists or swapfile.stat.size != (swap_size | human_to_bytes)

- name: Ghi swap vao fstab
  ansible.posix.mount:
    path: none
    src: /swapfile
    fstype: swap
    opts: sw
    state: present

- name: Giam xu huong dung swap
  ansible.posix.sysctl:
    name: vm.swappiness
    value: "10"
