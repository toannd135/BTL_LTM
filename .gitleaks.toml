title = "BTL_LTM gitleaks"

[extend]
useDefault = true

# Mat khau/khoa demo da biet (admin/admin, sv/sv...) chi dung de chay thu, khong phai bi mat that.
[allowlist]
description = "Tep demo/test va gia tri demo da biet"
paths = [
  '''ftp/src/main/resources/db/migration/V\d+__seed_accounts\.sql''',
  '''ftp/ftpserver\.conf''',
  '''ftp/scripts/.*_test\.py''',
  '''admin-web/test_admin\.py''',
  '''docs/handoff/.*''',
]
regexes = [
  '''(?i)\badmin/admin\b''',
  '''(?i)\bsv/sv\b''',
  '''(?i)demo[-_ ]?(secret|key)[-_a-z0-9]*''',
]
